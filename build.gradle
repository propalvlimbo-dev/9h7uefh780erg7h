plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	mods {
		"rose" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def buildLinks = [
	"update_url"   : (project.findProperty("update_url")   ?: ""),
	"official_page": (project.findProperty("official_page") ?: ""),
	"author_page"  : (project.findProperty("author_page")  ?: ""),
	"discord_page" : (project.findProperty("discord_page") ?: ""),
]

processResources {
	inputs.properties(buildLinks)
	inputs.property("version", project.version)

	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand("version": project.version)
	}
	filesMatching("rose-build.properties") {
		expand(buildLinks)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = Integer.parseInt(project.java_version as String)
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
