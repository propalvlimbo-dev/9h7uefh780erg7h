plugins {
    // Minecraft 26.2 is distributed with readable names and does not use mappings/remapping.
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Maxhenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    viaFabricPlusBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

// Published ViaFabricPlus keeps its public APIs as nested JARs, which javac cannot read directly.
def viaCompileApis = providers.provider {
    def bundle = configurations.viaFabricPlusBundle.singleFile
    def outputDirectory = layout.buildDirectory.dir("generated/via-apis/${project.viafabricplus_version}").get().asFile
    outputDirectory.mkdirs()
    def apiNames = [
        "viafabricplus-api-${project.viafabricplus_version}.jar",
        "viaversion-common-${project.viaversion_version}.jar"
    ]
    def extracted = []
    new java.util.zip.ZipFile(bundle).withCloseable { archive ->
        apiNames.each { name ->
            def entry = archive.getEntry("META-INF/jars/${name}")
            if (entry == null) {
                throw new GradleException("Pinned ViaFabricPlus bundle is missing public API ${name}")
            }
            def output = new File(outputDirectory, name)
            archive.getInputStream(entry).withCloseable { input ->
                java.nio.file.Files.copy(input, output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            extracted.add(output)
        }
    }
    extracted
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    // Nested libraries: also embedded into the jar through fabric.mod.json > jars.
    implementation files('src/main/resources/META-INF/jars/luaj-jse-3.0.1.jar')
    implementation files('src/main/resources/META-INF/jars/onnxruntime-1.27.0.jar')

    // Optional integrations need their public APIs during compilation.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    viaFabricPlusBundle "maven.modrinth:viafabricplus:${project.viafabricplus_version}"
    compileOnly files(viaCompileApis)
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/rose.accesswidener')
    runs {
        client {
            runDir 'run'
            vmArg '-Xmx3G'
        }
    }
}

sourceSets {
    main {
        java {
            exclude 'sg/modules/impl/init/RgExploit.java'
            exclude 'sg/modules/impl/init/Radius.java'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '10000', '-Xmaxwarns', '1000'])
    // Keep diagnostics in-process: thousands of decompiled sources are heavy for a forked worker.
    options.fork = false
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
}
